<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>youkai — 只读取证控制台</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="gate" class="gate hidden">
  <form id="gate-form">
    <h1>youkai</h1>
    <p class="muted">本机控制台需要访问令牌。启动 <code>youkaid</code> 时它会打印带令牌的地址。</p>
    <input id="gate-token" type="password" placeholder="API token" autocomplete="off" spellcheck="false">
    <button type="submit">进入</button>
    <p id="gate-err" class="err"></p>
  </form>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>youkai</strong>
        <div class="muted tiny">read-only brain · tier 2 stops at a human</div>
      </div>
    </div>

    <label class="field">
      <span class="label">作业</span>
      <select id="engagement"></select>
    </label>
    <button id="new-engagement" class="ghost tiny-btn">+ 新建作业</button>

    <nav id="nav">
      <button data-view="approvals" class="nav active">审批台<span id="badge-approvals" class="badge hidden"></span></button>
      <button data-view="evidence" class="nav">证据 · 报告</button>
      <button data-view="runs" class="nav">任务台</button>
      <button data-view="graph" class="nav">探索图</button>
      <button data-view="accounts" class="nav">账号 · 归属</button>
      <button data-view="config" class="nav">配置 · 墙</button>
      <button data-view="audit" class="nav">审计日志</button>
    </nav>

    <div class="foot">
      <div id="health" class="muted tiny">…</div>
      <button id="logout" class="ghost tiny-btn">退出令牌</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">审批台</h2>
      <div class="chips" id="chips"></div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-body" id="modal-body"></div></div>
<script src="/assets/app.js"></script>
</body>
</html>
