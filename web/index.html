<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>youkai — 只读取证控制台</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="gate" class="gate hidden">
  <form id="gate-form">
    <h1>youkai</h1>
    <p class="muted">本机控制台需要访问令牌。启动 <code>youkaid</code> 时它会打印带令牌的地址。</p>
    <input id="gate-token" type="password" placeholder="访问令牌" autocomplete="off" spellcheck="false">
    <button type="submit">进入</button>
    <p id="gate-err" class="err"></p>
  </form>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>youkai</strong>
        <div class="muted tiny">只读取证 · 出格的动作都要你点头</div>
      </div>
    </div>

    <label class="field">
      <span class="label">当前任务</span>
      <select id="engagement"></select>
    </label>
    <button id="new-engagement" class="primary tiny-btn">+ 新建任务</button>

    <nav id="nav">
      <button data-view="chat" class="nav active">对话</button>
      <button data-view="runs" class="nav">开始</button>
      <button data-view="approvals" class="nav">待办审批<span id="badge-approvals" class="badge hidden"></span></button>
      <button data-view="evidence" class="nav">结果</button>
      <button data-view="accounts" class="nav">账号</button>
      <button data-view="config" class="nav">设置</button>
      <details class="more">
        <summary>更多</summary>
        <button data-view="graph" class="nav">探索图</button>
        <button data-view="audit" class="nav">审计日志</button>
      </details>
    </nav>

    <div class="foot">
      <div id="health" class="muted tiny">…</div>
      <button id="logout" class="ghost tiny-btn">退出令牌</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">对话</h2>
      <div class="chips" id="chips"></div>
    </header>
    <div id="next-step" class="next-step hidden"></div>
    <div id="onboarding" class="onboarding hidden"></div>
    <div id="banner" class="banner hidden"></div>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-body" id="modal-body"></div></div>
<script src="/assets/wizard.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/stream.js"></script>
<script src="/assets/timeline.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
